<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lắp mô hình phân tử</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
/* Layout: sticky bench-clock header + station rail; one station (compound group) shown at a time:
   animated worked example (3D stage + step list) then build challenges that unlock a 3D answer model. */
:root {
  --bg: #F6F9FC; --surface: #FFFFFF; --surface2: #EAF4FB; --line: #C9DCEE; --ink: #0B1F3A; --muted: #4E6178;
  --accent: #1B7F9C; --accent-ink: #FFFFFF; --accent-soft: #D8F1F6; --accent-rgb: 27, 127, 156;
  --good: #2E8540; --good-soft: #E2F4E5; --bad: #B83A3A; --bad-soft: #FDEAEA; --warn: #9A6410; --warn-soft: #FFF0C7;
  --stage: #E6F1FA; --grid: rgba(30, 136, 168, .14);
  --bond: #8996A6; --bondEdge: #56667A; --rim: rgba(11, 31, 58, .38); --tagBg: #FFFFFF; --tagInk: #0B1F3A;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-head: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1F3A; --surface: #132239; --surface2: #182C47; --line: #2A4465; --ink: #E8F1FA; --muted: #A2B5CA;
    --accent: #17C3D6; --accent-ink: #06222B; --accent-soft: #0F3A4E; --accent-rgb: 23, 195, 214;
    --good: #66CC75; --good-soft: #15361F; --bad: #FF8E8E; --bad-soft: #3B1D25; --warn: #FFC857; --warn-soft: #3A3014;
    --stage: #0E2744; --grid: rgba(23, 195, 214, .11);
    --bond: #B3BFCE; --bondEdge: #7D8BA0; --rim: rgba(255, 255, 255, .32); --tagBg: #132239; --tagInk: #E8F1FA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1F3A; --surface: #132239; --surface2: #182C47; --line: #2A4465; --ink: #E8F1FA; --muted: #A2B5CA;
  --accent: #17C3D6; --accent-ink: #06222B; --accent-soft: #0F3A4E; --accent-rgb: 23, 195, 214;
  --good: #66CC75; --good-soft: #15361F; --bad: #FF8E8E; --bad-soft: #3B1D25; --warn: #FFC857; --warn-soft: #3A3014;
  --stage: #0E2744; --grid: rgba(23, 195, 214, .11);
  --bond: #B3BFCE; --bondEdge: #7D8BA0; --rim: rgba(255, 255, 255, .32); --tagBg: #132239; --tagInk: #E8F1FA;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  margin: 0; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
sub { font-size: .72em; line-height: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 1120px; margin: 0 auto; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 10px 4px; }
.brand h1 { font-family: var(--f-head); font-size: 19px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.brand p { font-size: 12.5px; color: var(--muted); }
.clock { display: flex; align-items: center; gap: 8px; }
.clock-digits { font-family: var(--f-head); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: right; }
.clock.low .clock-digits { color: var(--warn); }
.clock-cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 13px; font-weight: 500; font-size: 13.5px; line-height: 1.3; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn svg { width: 15px; height: 15px; flex: none; }

.rail { display: flex; overflow-x: auto; scrollbar-width: thin; margin-top: 2px; }
.stop { flex: 1 0 auto; min-width: 96px; display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px 7px; color: var(--muted); }
.stop:hover { background: var(--surface2); }
.stop[aria-current="true"] { border-bottom-color: var(--accent); color: var(--ink); }
.stop-n { font-family: var(--f-head); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.stop-name { font-weight: 600; font-size: 13px; line-height: 1.25; }
.stop-t { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.stop.done .stop-n { color: var(--good); }
.stop.late .stop-t { color: var(--warn); font-weight: 600; }
.stop svg { width: 13px; height: 13px; vertical-align: -1px; color: var(--good); }

/* ---------- page ---------- */
.page { padding-block: 22px 56px; }
.mod { display: none; }
.mod.on { display: block; }
.mod-head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 78ch; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.mod-head h2 { font-family: var(--f-head); font-size: clamp(26px, 4vw, 34px); line-height: 1.15; font-weight: 700; text-wrap: balance; }
.mod-goal { color: var(--muted); text-wrap: pretty; }
.pace { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.pace b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 18px; }
.card-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 14px; }
.card-h h3 { font-family: var(--f-head); font-size: 20px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.tag { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }

/* ---------- 3D stage + steps ---------- */
.ex { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { position: relative; aspect-ratio: 4 / 3; min-height: 250px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  background-color: var(--stage);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.stage-hint { position: absolute; left: 10px; top: 8px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
.stage-tools { position: absolute; right: 8px; top: 6px; display: flex; gap: 6px; }
.mini { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 5px; padding: 3px 8px; font-size: 11.5px; }
.mini[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.kitbar { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; align-items: center; }
.kitbar .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--rim); flex: none; }
.stick { width: 15px; height: 0; border-top: 4px solid var(--bond); border-radius: 2px; flex: none; }
.stick.d { height: 5px; border-top: 2px solid var(--bond); border-bottom: 2px solid var(--bond); }
.stick.t { height: 8px; border-top: 2px solid var(--bond); border-bottom: 2px solid var(--bond); background: linear-gradient(var(--bond), var(--bond)) center / 100% 2px no-repeat; }

.steps { display: grid; gap: 6px; list-style: none; padding: 0; margin: 0; }
.step { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; }
.step:hover { border-color: var(--accent); }
.step-n { grid-row: 1; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-t { font-weight: 600; font-size: 14px; line-height: 1.35; align-self: center; }
.step-d { grid-column: 2; font-size: 13.5px; color: var(--muted); display: none; text-wrap: pretty; }
.step.past .step-n { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.step.cur .step-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.cur .step-d { display: block; color: var(--ink); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ---------- legend (khởi động) ---------- */
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.leg { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; background: var(--surface); }
.ball { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 1px solid var(--rim); }
.leg b { font-size: 14px; }
.leg span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 0 4px; counter-reset: f; }
.flow li { counter-increment: f; border-top: 3px solid var(--accent); background: var(--surface2); padding: 9px 11px 10px; font-size: 13.5px; border-radius: 0 0 6px 6px; }
.flow li::before { content: counter(f); font-family: var(--f-head); font-weight: 700; color: var(--accent); margin-right: 7px; }
.flow b { display: block; font-size: 14px; }
.subhead { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }

/* ---------- tasks ---------- */
.brief { max-width: 78ch; text-wrap: pretty; }
.kitline { margin: 12px 0 4px; padding: 9px 12px; background: var(--surface2); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13.5px; }
.kitline .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.qs { display: grid; gap: 14px; margin: 16px 0 6px; }
.q-text { font-weight: 600; margin-bottom: 8px; text-wrap: pretty; max-width: 78ch; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 13px; text-align: left; font-size: 14px; max-width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { background: var(--good-soft); border-color: var(--good); color: var(--ink); font-weight: 600; }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; text-decoration-color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { font-size: 13.5px; margin-top: 7px; min-height: 1.4em; max-width: 78ch; text-wrap: pretty; }
.fb.ok { color: var(--good); }
.fb.bad { color: var(--bad); }
.reveal-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 14px; }
.reveal-note { font-size: 13px; color: var(--muted); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 232px), 1fr)); gap: 12px; margin-top: 14px; }
.rcard { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.rcard .stage { aspect-ratio: 1 / 1; min-height: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.rcap { padding: 9px 11px 11px; display: grid; gap: 2px; }
.rcap b { font-size: 14px; }
.rcap .fx { font-size: 13px; color: var(--muted); }

.modnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.modnav .btn-primary.pulse { box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .28); }

/* ---------- quiz + summary ---------- */
.qopts { display: flex; flex-wrap: wrap; gap: 8px; }
.qprog { display: flex; gap: 6px; margin-bottom: 12px; }
.qprog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.qprog i.ok { background: var(--good); }
.qprog i.bad { background: var(--bad); }
.qprog i.cur { background: var(--accent); }
.score { font-family: var(--f-head); font-size: 22px; font-weight: 700; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface2); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; white-space: nowrap; }

.teacher { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.teacher summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.teacher .body { padding: 2px 14px 14px; display: grid; gap: 12px; font-size: 13.5px; }
.teacher ul { margin: 0; padding-left: 18px; }

@media (max-width: 860px) {
  .ex { grid-template-columns: 1fr; }
  .stop { min-width: 88px; }
}
@media (max-width: 480px) {
  .clock-digits { font-size: 24px; }
  .card { padding: 14px; }
  .btn { padding: 7px 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
<header class="top">
  <div class="gut"><div class="in">
    <div class="top-row">

        <h1>Lắp mô hình phân tử</h1>
        <p>Hóa học hữu cơ 11 và Chương 1 Hóa học 12 · hoạt động 45 phút</p>

        <span class="clock-cap">Còn lại</span>

        <button class="btn" id="clockReset" type="button">Đặt lại</button>
      </div>

</header>

<script>
/* ===== Chem engine: SMILES subset -> 3D ball-and-stick coordinates ===== */
const Chem = (() => {
  const D2R = Math.PI / 180;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const unit = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  const VAL = { C: 4, H: 1, O: 2, N: 3, Cl: 1, Br: 1 };
  // display radii (angstrom-scaled) so short sticks stay visible between balls
  const RAD = { H: 0.30, C: 0.46, O: 0.44, N: 0.44, Cl: 0.62, Br: 0.70 };

  function parse(smi) {
    const atoms = [], nb = [], bonds = [];
    const stack = [], rings = {};
    let prev = -1, pend = null;
    const link = (a, b, o) => {
      if (o == null) o = (atoms[a].arom && atoms[b].arom) ? 1.5 : 1;
      bonds.push({ a, b, o });
      nb[a].push({ j: b, o });
      nb[b].push({ j: a, o });
    };
    for (let i = 0; i < smi.length;) {
      const ch = smi[i];
      if (ch === '(') { stack.push(prev); i++; continue; }
      if (ch === ')') { prev = stack.pop(); i++; continue; }
      if (ch === '-') { pend = 1; i++; continue; }
      if (ch === '=') { pend = 2; i++; continue; }
      if (ch === '#') { pend = 3; i++; continue; }
      if (ch >= '0' && ch <= '9') {
        if (rings[ch] === undefined) rings[ch] = prev;
        else { link(rings[ch], prev, pend); delete rings[ch]; }
        pend = null; i++; continue;
      }
      let el, arom = false;
      if (smi.startsWith('Cl', i)) { el = 'Cl'; i += 2; }
      else if (smi.startsWith('Br', i)) { el = 'Br'; i += 2; }
      else { el = ch; i++; if (el === 'c') { el = 'C'; arom = true; } }
      const idx = atoms.length;
      atoms.push({ el, arom });
      nb.push([]);
      if (prev >= 0) link(prev, idx, pend);
      pend = null; prev = idx;
    }
    return { atoms, nb, bonds, nHeavy: atoms.length };
  }

  function addH(m) {
    for (let i = 0; i < m.nHeavy; i++) {
      const sum = m.nb[i].reduce((s, x) => s + x.o, 0);
      const h = Math.max(0, Math.round(VAL[m.atoms[i].el] - sum));
      for (let k = 0; k < h; k++) {
        const idx = m.atoms.length;
        m.atoms.push({ el: 'H', arom: false, hOf: i });
        m.nb.push([]);
        m.bonds.push({ a: i, b: idx, o: 1 });
        m.nb[i].push({ j: idx, o: 1 });
        m.nb[idx].push({ j: i, o: 1 });
      }
    }
    return m;
  }

  function geoOf(m, i) {
    const a = m.atoms[i];
    if (a.el === 'H' || a.el === 'Cl' || a.el === 'Br') return 'term';
    const os = m.nb[i].map(x => x.o);
    if (a.el === 'O') return os.includes(2) ? 'term' : 'bent';
    if (a.el === 'C') {
      if (os.includes(3) || os.filter(o => o === 2).length >= 2) return 'sp';
      if (os.includes(2) || a.arom) return 'sp2';
      return 'sp3';
    }
    return 'sp3';
  }

  function bondLen(m, a, b, o) {
    const ea = m.atoms[a].el, eb = m.atoms[b].el;
    const pair = [ea, eb].sort().join('-');
    switch (pair) {
      case 'C-H': return 1.09;
      case 'H-O': return 0.96;
      case 'C-Cl': return 1.77;
      case 'Br-C': return 1.94;
      case 'C-C': {
        if (o === 1.5) return 1.40;
        if (o === 2) return 1.34;
        if (o === 3) return 1.20;
        const ga = geoOf(m, a), gb = geoOf(m, b);
        if (ga === 'sp' || gb === 'sp') return 1.46;
        if (ga === 'sp2' || gb === 'sp2') return 1.51;
        return 1.54;
      }
      case 'C-O': {
        if (o === 2) return 1.22;
        const c = ea === 'C' ? a : b;
        return geoOf(m, c) === 'sp2' ? 1.35 : 1.43;
      }
      default: return 1.5;
    }
  }

  function aromComps(m) {
    const seen = new Set(), comps = [];
    for (let i = 0; i < m.nHeavy; i++) {
      if (!m.atoms[i].arom || seen.has(i)) continue;
      const ring = [i];
      seen.add(i);
      let cur = i, prevA = -1;
      for (;;) {
        const nx = m.nb[cur].find(x => x.o === 1.5 && x.j !== prevA && !seen.has(x.j));
        if (!nx) break;

          const ok = c === r.ans;
          if (ok) score++;
          bs.forEach(x => { x.disabled = true; if (x.textContent === r.ans) x.classList.add('ok'); });
          if (!ok) b.classList.add('bad');
          pips[idx].className = ok ? 'ok' : 'bad';
          fb.className = 'fb ' + (ok ? 'ok' : 'bad');
          fb.innerHTML = (ok ? 'Đúng. ' : 'Chưa đúng, đáp án là ' + r.ans + '. ') + '<b>' + r.name + '</b>: ' + T(r.why);
          const nx = h('button', 'btn btn-primary', idx < QUIZ_ROUNDS.length - 1 ? 'Câu tiếp' + IC.next : 'Xem kết quả');
          nx.type = 'button';
          nx.addEventListener('click', () => { if (idx < QUIZ_ROUNDS.length - 1) { idx++; round(); } else end(); });
          right.append(nx);
        });
        o.appendChild(b); return b;
      });
      right.append(o, fb);
    }
    function end() {
      if (viewer) viewer.destroy(); viewer = null;
      body.innerHTML = '';
      const box = h('div');
      box.append(h('p', 'score', score + ' / ' + QUIZ_ROUNDS.length + ' mô hình nhận đúng'),
        h('p', 'brief', score >= 7 ? 'Em đã đọc được cấu trúc của hầu hết các nhóm hợp chất. Đối chiếu bảng dưới đây để chốt lại.' : 'Xem lại bảng dưới đây: dấu hiệu trên mô hình quyết định nhóm hợp chất, không phải số carbon.'));
      const again = h('button', 'btn', IC.replay + 'Làm lại'); again.type = 'button';
      again.addEventListener('click', () => { idx = 0; score = 0; pips.forEach(p => p.className = ''); card.replaceChild(body, box); body.innerHTML = ''; body.append(left, right); round(); });
      box.append(again); box.style.display = 'grid'; box.style.gap = '10px'; box.style.justifyItems = 'start';
      card.append(box);
      body.replaceWith(box);
      finish(N - 1);
    }
    round();
    return card;
  }
  function buildSummary() {
    const card = h('article', 'card');
    const hd = h('div', 'card-h'); hd.append(h('span', 'tag', 'Chốt kiến thức'), h('h3', null, 'Dấu hiệu trên mô hình của từng nhóm'));
    const rows = SUMMARY_ROWS.map(r => '<tr><td>' + r[0] + '</td><td>' + T(r[1]) + '</td><td>' + T(r[2]) + '</td></tr>').join('');
    const tw = h('div', 'tablewrap', '<table><thead><tr><th>Nhóm</th><th>Nhìn thấy trên mô hình</th><th>Hình dạng quanh nguyên tử then chốt</th></tr></thead><tbody>' + rows + '</tbody></table>');
    card.append(hd, tw);
    return card;
  }

  /* ---------- teacher panel + legend (khởi động) ---------- */
  function buildTeacher() {
    const d = h('details', 'teacher'), mx = { atoms: {}, single: 0, dbl: 0, trip: 0 };
    MODULES.forEach(m => (m.tasks || []).forEach(t => (t.mols || []).forEach(s => {
      const inv = Chem.inventory(getMol(s));
      Object.keys(inv.atoms).forEach(e => { mx.atoms[e] = Math.max(mx.atoms[e] || 0, inv.atoms[e]); });
      mx.single = Math.max(mx.single, inv.single); mx.dbl = Math.max(mx.dbl, inv.dbl); mx.trip = Math.max(mx.trip, inv.trip);
    })));
    let t0 = 0;
    const plan = MODULES.map((m, i) => { const s = t0; t0 += m.min; return '<li>Phút ' + s + '–' + t0 + ': ' + (i === 0 ? 'Khởi động' : i === N - 1 ? 'Tổng kết' : 'Nhóm ' + i + ' · ' + m.short) + '</li>'; }).join('');
    d.innerHTML = '<summary>Dành cho giáo viên: nhịp 45 phút và kit cần chuẩn bị</summary><div class="body">' +
      '<div><b>Nhịp lớp học</b><ul>' + plan + '</ul></div>' +
      '<div><b>Kit tối thiểu cho mỗi học sinh</b> (lắp từng mô hình một, tháo ra sau khi đối chiếu)<div class="kitline">' + invHTML(mx) + '</div></div>' +
      '<div><b>Gợi ý tổ chức</b><ul>' +
      '<li>Mỗi nhóm: học sinh xem ví dụ mẫu và lắp song song 1 phút, tự lắp các mô hình của thử thách, trả lời câu hỏi rồi mới mở mô hình 3D để đối chiếu.</li>' +
      '<li>Lớp ít học sinh: chia các mô hình trong mỗi thử thách cho từng em lắp riêng, sau đó đối chiếu kết quả với nhau.</li>' +
      '<li>Thiếu thời gian: bỏ thử thách 2 của nhóm 2 hoặc nhóm 5, hoặc bỏ nhóm 4 (3 phút).</li>' +
      '<li>Đồng hồ chỉ nhắc nhịp: mốc nhóm nào bị quá sẽ đổi sang màu vàng trên thanh nhóm.</li></ul></div></div>';
    return d;
  }
  function buildLegend() {
    const card = h('article', 'card');
    const hd = h('div', 'card-h'); hd.append(h('span', 'tag', 'Bộ linh kiện'), h('h3', null, 'Quả cầu, lỗ và que liên kết'));
    const holes = { C: 4, H: 1, O: 2, Cl: 1, Br: 1 }, nm = { C: 'Carbon', H: 'Hydrogen', O: 'Oxygen', Cl: 'Chlorine', Br: 'Bromine' };
    let lg = '';
    ['C', 'H', 'O', 'Cl', 'Br'].forEach(e => {
      lg += '<div class="leg"><div class="ball" style="background:radial-gradient(circle at 35% 30%,' + KIT[e].light + ',' + KIT[e].base + ' 55%,' + KIT[e].dark + ');color:' + KIT[e].text + '">' + e + '</div><b>' + nm[e] + '</b><span>Màu ' + KIT[e].name + ' · ' + holes[e] + ' lỗ</span></div>';
    });
    lg += '<div class="leg"><div><i class="stick" style="width:30px"></i></div><b>1 que cứng</b><span>Liên kết đơn σ</span></div>' +
      '<div class="leg"><div><i class="stick d" style="width:30px"></i></div><b>2 lò xo</b><span>Liên kết đôi: 1σ + 1π</span></div>' +
      '<div class="leg"><div><i class="stick t" style="width:30px"></i></div><b>3 lò xo</b><span>Liên kết ba: 1σ + 2π</span></div>';
    card.append(hd, h('div', 'legend', lg), h('p', 'subhead', 'Quy trình lắp dùng cho mọi nhóm'),
      h('ol', 'flow', '<li><b>Khung carbon</b>Nối các C bằng que.</li><li><b>Nguyên tử khác</b>Gắn O, halogen, nối đôi, nối ba.</li><li><b>Điền H</b>Lấp mọi lỗ còn trống bằng H.</li><li><b>Kiểm tra</b>C đủ 4 liên kết, O đủ 2, H và halogen đủ 1.</li>'));
    return card;
  }

  /* ---------- assemble stations ---------- */
  function finish(i) { if (!state.done.has(i)) { state.done.add(i); paintRail(); const nb = secs[i].querySelector('.nextbtn'); if (nb) nb.classList.add('pulse'); } }
  MODULES.forEach((m, i) => {
    const sec = h('section', 'mod'); sec.id = m.id;
    const hd = h('header', 'mod-head');
    const eb = i === 0 ? 'Khởi động · ' + m.min + ' phút' : m.final ? 'Tổng kết · ' + m.min + ' phút' : 'Nhóm ' + i + ' · ' + m.group + ' · ' + m.min + ' phút';
    hd.append(h('span', 'eyebrow', eb), h('h2', null, T(m.title)), h('p', 'mod-goal', T(m.goal)));
    hd.append(h('p', 'pace', m.final ? '<span>Kết thúc ở <b>phút ' + cum[i] + '</b></span><span>Khoảng 30 giây cho mỗi mô hình</span>'
      : '<span>Kết thúc ở <b>phút ' + cum[i] + '</b></span><span>Xem ví dụ <b>1 phút</b></span><span>Lắp và trả lời <b>' + (m.min - 1) + ' phút</b></span>'));
    sec.append(hd);
    if (i === 0) sec.append(buildTeacher(), buildLegend());
    if (m.example) {
      const card = h('article', 'card'), ch = h('div', 'card-h');
      ch.append(h('span', 'tag', 'Ví dụ mẫu · chạy từng bước'), h('h3', null, T(m.example.title)));
      const sp = buildStepper(m); steppers[i] = sp;
      card.append(ch, sp.root); sec.append(card);
    }
    (m.tasks || []).forEach((t, ti) => sec.append(buildTask(i, t, ti)));
    if (m.final) sec.append(buildQuiz(), buildSummary());
    const nav = h('div', 'modnav');
    const bp = h('button', 'btn', IC.prev + (i ? 'Nhóm trước' : 'Đầu bài')); bp.type = 'button'; bp.disabled = i === 0;
    bp.addEventListener('click', () => go(i - 1));
    nav.append(bp);
    if (i < N - 1) { const bn = h('button', 'btn btn-primary nextbtn', 'Tiếp: ' + MODULES[i + 1].short + IC.next); bn.type = 'button'; bn.addEventListener('click', () => go(i + 1)); nav.append(bn); }
    sec.append(nav);
    stage.appendChild(sec); secs.push(sec);
  });

  function go(i, noScroll) {
    i = Math.max(0, Math.min(N - 1, i));
    secs.forEach((s, j) => s.classList.toggle('on', j === i));
    state.cur = i; paintRail();
    if (steppers[i]) steppers[i].reset();
    const b = rail.children[i]; if (b && b.scrollIntoView) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (!noScroll) window.scrollTo(0, 0);
  }
  const hm = /^#m(\d)$/.exec(location.hash || '');
  go(hm ? +hm[1] : 0, true);
  paintClock();
  window.addEventListener('hashchange', () => { const x = /^#m(\d)$/.exec(location.hash || ''); if (x) go(+x[1]); });
})();
</script>
